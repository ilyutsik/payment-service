plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.3'
    id "jacoco"
    id "org.sonarqube" version "7.2.3.7755"
}

group = 'com.innowise.paymentservice'
version = '1.0'

ext {
    testcontainersVersion = '1.21.4'
    lombokVersion = '1.18.32'
    mapstructVersion = '1.5.5.Final'
    liquibaseCoreVersion = '5.0.2'
    liquibaseMongoVersion = '5.0.2'
    wiremockVersion = '3.5.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    implementation "org.liquibase:liquibase-core:${liquibaseCoreVersion}"
    implementation "org.liquibase.ext:liquibase-mongodb:${liquibaseMongoVersion}"

    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:mongodb:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}
tasks.withType(JavaExec) {
    jvmArgs += "--add-opens=java.base/java.math=ALL-UNNAMED"
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = 'full'
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "ilyutsik_payment-service"
        property "sonar.organization", "ilyutsik"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.exclusions", [
                "**/config/**",
                "**/client/**",
                "**/mapper/**",
                "**/model/**",
                "**/kafka/**",
                "**/exception/**",
                "**/*Application.java"
        ].join(",")
    }
}